<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KloudPDF — PDF tools. Made simple.</title>
    <meta name="description" content="KloudPDF — Privacy-first, 100% browser-based PDF tools: edit, compress, merge, split, OCR, redact, convert, and batch process documents locally on your device." />
    <meta name="theme-color" content="#0066ff" />
    <link rel="canonical" href="https://kloudpdf.com/" />

    <!-- Icons & PWA Manifest -->
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Open Graph / Social Sharing Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KloudPDF — Privacy-First Browser PDF Platform" />
    <meta property="og:description" content="Edit, compress, convert, OCR, redact, and batch process PDFs directly inside your browser without uploading files to any server." />
    <meta property="og:site_name" content="KloudPDF" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KloudPDF — PDF tools. Made simple." />
    <meta name="twitter:description" content="100% client-side PDF toolkit running directly in your browser." />

    <!-- Factual Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "KloudPDF",
        "description": "Browser-based, privacy-first PDF productivity tools executing locally on the user's device without server document uploads.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
