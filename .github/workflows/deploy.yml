name: KloudPDF CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kloudpdf-production
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: BUILD AND VALIDATE
  # ==========================================
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint --if-present

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: kloudpdf-build
          path: dist/
          retention-days: 7

  # ==========================================
  # JOB 2: DEPLOY TO HOSTINGER USING SSH
  # ==========================================
  deploy:
    name: Deploy to Hostinger (SSH)
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # Download production build
      - name: Download Build
        uses: actions/download-artifact@v7
        with:
          name: kloudpdf-build
          path: dist/

      # Configure SSH authentication
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save private SSH key
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kloudpdf_deploy

          chmod 600 ~/.ssh/kloudpdf_deploy

          # Retrieve Hostinger SSH host key
          ssh-keyscan -T 10 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          # Verify Hostinger fingerprint
          ACTUAL_FINGERPRINT=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')

          EXPECTED_FINGERPRINT="SHA256:qp+sqKADrulB5cDJwE61uWyoPe9Ceq/jPmr8PZPioM4"

          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "ERROR: Hostinger SSH fingerprint verification failed!"
            exit 1
          fi

          echo "SSH configuration successful."
          echo "Hostinger fingerprint verified."

      # Deploy website using SCP
      - name: Deploy Website
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

        run: |
          set -euo pipefail

          echo "Starting KloudPDF deployment..."

          scp \
            -i ~/.ssh/kloudpdf_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -P "$SSH_PORT" \
            -r dist/. \
            "$SSH_USERNAME@$SSH_HOST:/home/u942254885/public_html/public_html/"

          echo "================================"
          echo "KloudPDF deployment successful!"
          echo "================================"
